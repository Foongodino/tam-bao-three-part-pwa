    const fromBase64=(value)=>Uint8Array.from(atob(value),(character)=>character.charCodeAt(0));
    document.getElementById("unlockForm").addEventListener("submit",async(event)=>{
      event.preventDefault();
      const password=document.getElementById("password").value;
      const button=document.getElementById("unlock");
      const message=document.getElementById("message");
      button.disabled=true;
      message.textContent="正在解密…";
      try{
        if(!globalThis.crypto?.subtle) throw new Error("Web Crypto unavailable");
        const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
        const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:fromBase64(payload.salt),iterations:payload.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
        const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromBase64(payload.iv)},key,fromBase64(payload.data));
        const html=new TextDecoder().decode(decrypted);
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        message.textContent=error?.message==="Web Crypto unavailable" ? "此瀏覽器無法解密，請使用最新版 Google Chrome。" : "密碼不正確，請重新輸入。";
        document.getElementById("password").select();
        button.disabled=false;
      }
    });
